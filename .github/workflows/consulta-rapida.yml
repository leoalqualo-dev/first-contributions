name: Consulta rápida de passagens

on:
  push:
    paths: ["passagens-libertadores/consulta.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: passagens-libertadores
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Consultar trechos do consulta.txt
        run: python buscar.py --consulta consulta.txt
      - name: Salvar resultado
        run: |
          cat CONSULTA.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "rastreador-passagens"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CONSULTA.md
          git diff --cached --quiet || git commit -m "Passagens: consulta rápida $(date -u +'%d/%m %H:%M') UTC"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
